[platformio]
default_envs = ota
extra_configs = secrets.ini   ; пароль OTA (скопіюй secrets.example.ini -> secrets.ini)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=3        ; 0=вимк, 1=E, 2=W, 3=I, 4=D, 5=V
lib_deps =
    olikraus/U8g2 @ ^2.35.19

; Прошивка по WiFi
[env:ota]
upload_protocol = espota
upload_port = esp32-test.local   ; якщо mDNS не працює, впиши IP плати

; Прошивка по кабелю: pio run -e usb -t upload
[env:usb]